[package]
name = "toolbox"
version = "26.11.0"
description = "A Tauri App"
authors = ["you"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
# Дата и время в имени файла лога — локальные, а не UTC: имя должно совпадать
# с сутками пользователя. Остальные возможности `chrono` не нужны.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Словари интерфейса: JSON с комментариями и висячими запятыми (ADR 0039).
# Строгий serde_json такие файлы не читает, а пользователь должен иметь
# возможность подписать ключ или закомментировать его.
json5 = "1"
# DNS: только протокол и разбор ответов. Транспорт — свой, синхронный:
# клиентские обёртки hickory тянут tokio, а приложению он не нужен (ADR 0016).
hickory-proto = "0.26.3"
# Системные резолверы Windows: без вызова ipconfig.exe и разбора его вывода.
ipconfig = "0.3"

# Видимая граница окна: `GetWindowRect` шире её на невидимую рамку, и без
# поправки окно встаёт к рабочей области с щелью (ADR 0064).
[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
